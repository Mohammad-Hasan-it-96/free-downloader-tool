[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "free-downloader-tool"
dynamic = ["version"]          # taken from fdl/__init__.py
description = "A download manager for the terminal: media sites and direct links, with resume, a queue, and sorting by file type."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohamad Hasan" }]
keywords = ["download", "downloader", "download-manager", "yt-dlp", "resume",
            "aria2", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Mohammad-Hasan-it-96/free-downloader-tool"
Issues = "https://github.com/Mohammad-Hasan-it-96/free-downloader-tool/issues"

[project.scripts]
fdl = "fdl.app:run"
free-downloader = "fdl.app:run"

[tool.setuptools]
packages = ["fdl"]

[tool.setuptools.dynamic]
version = { attr = "fdl.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
